basePath: /api
definitions:
  adapters_in_rest.accountDTO:
    properties:
      email:
        type: string
      org_id:
        type: string
      pseudo:
        type: string
      role:
        type: string
    type: object
  adapters_in_rest.accountRequestDTO:
    properties:
      display_name:
        type: string
      email:
        type: string
      message:
        type: string
      org_id:
        type: string
      pseudo:
        type: string
    type: object
  adapters_in_rest.assemblyLinkRequest:
    properties:
      fastener_asset_id:
        type: string
      from_iface_id:
        type: string
      from_instance_id:
        type: string
      label:
        type: string
      to_iface_id:
        type: string
      to_instance_id:
        type: string
    type: object
  adapters_in_rest.componentDTO:
    properties:
      assemblies:
        items:
          type: string
        type: array
      block_id:
        type: string
      category:
        $ref: '#/definitions/myr-core_domain_model.Category'
      created_at:
        type: string
      description:
        type: string
      hash:
        type: string
      id:
        type: string
      instances:
        items:
          $ref: '#/definitions/myr-core_domain_model.WorkspaceInstance'
        type: array
      license_id:
        type: string
      links:
        items:
          type: string
        type: array
      module_versions:
        items:
          $ref: '#/definitions/myr-core_domain_model.ModuleVersion'
        type: array
      name:
        type: string
      owner_id:
        type: string
      parent_id:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/myr-core_domain_model.ModuleStatus'
        description: |-
          Status vaut "draft" (créé via draft:true, pas encore engagé sur la blockchain
          — voir POST /components/{id}/submit) ou "submitted" (comportement nominal,
          immédiat). Vide pour un composant créé avant l'introduction du brouillon.
      tags:
        items:
          type: string
        type: array
      thumbnail:
        type: string
    type: object
  adapters_in_rest.connectionDTO:
    properties:
      fastener_asset_id:
        type: string
      from:
        type: string
      from_iface_id:
        type: string
      from_instance_id:
        type: string
      id:
        type: string
      incompatible:
        type: boolean
      label:
        type: string
      to:
        type: string
      to_iface_id:
        type: string
      to_instance_id:
        type: string
    type: object
  adapters_in_rest.graphResponse:
    properties:
      components:
        items:
          $ref: '#/definitions/adapters_in_rest.componentDTO'
        type: array
      connections:
        items:
          $ref: '#/definitions/adapters_in_rest.connectionDTO'
        type: array
      degraded:
        description: |-
          Degraded et Warning ne sont présents que si la blockchain était injoignable au
          moment de la requête : la réponse ne contient alors que les brouillons locaux
          (non soumis), pas les assets on-chain — voir listGraph.
        type: boolean
      total:
        type: integer
      warning:
        type: string
    type: object
  adapters_in_rest.networkPolicyResponse:
    properties:
      allow_auto_guest:
        description: le réseau délivre un accès reader automatiquement
        type: boolean
      allow_auto_register:
        description: le réseau accepte les demandes d'inscription
        type: boolean
      mode:
        description: '"blockchain"'
        type: string
      network_name:
        type: string
      require_approval:
        description: une inscription doit être approuvée par l'admin avant d'être
          active
        type: boolean
    type: object
  adapters_in_rest.roleRequestDTO:
    properties:
      role:
        type: string
    type: object
  adapters_in_rest.sessionDTO:
    properties:
      channel:
        description: canal Fabric actif
        type: string
      guest:
        type: boolean
      pseudo:
        type: string
      role:
        description: '"reader" | "contributor" | ...'
        type: string
      token:
        type: string
    type: object
  adapters_in_rest.statusResponse:
    properties:
      assets:
        type: integer
      channel:
        type: string
      connected:
        type: boolean
      mode:
        type: string
      network:
        type: string
      peer:
        type: string
    type: object
  adapters_in_rest.virtualConnectRequest:
    properties:
      from_instance_id:
        type: string
      is_range:
        type: boolean
      name:
        type: string
      physical_iface_id:
        type: string
      to_instance_id:
        type: string
      unit:
        type: string
      value_max:
        type: number
      value_min:
        type: number
      virtual_iface_id:
        type: string
    type: object
  adapters_in_rest.walletDTO:
    properties:
      guest:
        description: true = identité invité (lecture seule)
        type: boolean
      handle:
        description: '"alice@Org1"'
        type: string
      name:
        description: '"alice"'
        type: string
      org_id:
        description: '"Org1MSP"'
        type: string
      status:
        description: '"pending" | "active" | "suspended"'
        type: string
    type: object
  myr-core_domain_identity.AccountRequest:
    properties:
      created_at:
        description: ISO 8601
        type: string
      display_name:
        description: nom affiché
        type: string
      email:
        type: string
      id:
        type: string
      kind:
        description: 'vide : inscription ; RequestKindRole : demande de rôle'
        type: string
      message:
        description: message libre pour l'admin
        type: string
      org_id:
        description: 'organisation souhaitée (ex: Org1MSP)'
        type: string
      pseudo:
        description: identifiant souhaité
        type: string
      role:
        description: rôle demandé (demande de rôle uniquement)
        type: string
      status:
        description: '"pending" | "approved" | "rejected" | "failed"'
        type: string
    type: object
  myr-core_domain_model.AssetInterface:
    properties:
      asset_id:
        type: string
      category:
        description: '"ELEC", "MECA", "HYD" ou custom'
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/myr-core_domain_model.IfaceDirection'
        description: '"in", "out", "bidir"'
      id:
        type: string
      is_range:
        description: true si plage de valeurs
        type: boolean
      name:
        description: label optionnel
        type: string
      type:
        description: 'ex: "DIN", "Vis M3"'
        type: string
      unit:
        description: 'ex: "V", "mm", "bar"'
        type: string
      value_max:
        description: borne haute (si IsRange)
        type: number
      value_min:
        description: valeur unique ou borne basse
        type: number
      virtual:
        description: true = point de connexion non encore matérialisé
        type: boolean
    type: object
  myr-core_domain_model.Category:
    enum:
    - base
    - amelioration
    - variation
    - adaptation
    - derivation
    - extension
    - regression
    type: string
    x-enum-varnames:
    - CategoryBase
    - CategoryAmelioration
    - CategoryVariation
    - CategoryAdaptation
    - CategoryDerivation
    - CategoryExtension
    - CategoryRegression
  myr-core_domain_model.IfaceDirection:
    enum:
    - in
    - out
    - bidir
    type: string
    x-enum-varnames:
    - IfaceIn
    - IfaceOut
    - IfaceBidi
  myr-core_domain_model.License:
    properties:
      compatible_with:
        description: |-
          CompatibleWith liste les IDs de licences autorisées pour les œuvres dérivées.
          Vide = aucune dérivation permise.
        items:
          type: string
        type: array
      conditions:
        description: 'ex: "include-copyright", "same-license"'
        items:
          type: string
        type: array
      description:
        description: résumé humain
        type: string
      id:
        type: string
      limitations:
        description: 'ex: "liability", "trademark-use"'
        items:
          type: string
        type: array
      name:
        type: string
      permissions:
        description: 'ex: "commercial-use", "modifications"'
        items:
          type: string
        type: array
      spdx:
        description: 'identifiant SPDX normalisé (ex: "CC-BY-4.0")'
        type: string
    type: object
  myr-core_domain_model.ModuleStatus:
    enum:
    - draft
    - submitted
    type: string
    x-enum-comments:
      ModuleDraft: en cours de composition
      ModuleSubmitted: soumis à la blockchain
    x-enum-varnames:
    - ModuleDraft
    - ModuleSubmitted
  myr-core_domain_model.ModuleVersion:
    properties:
      assemblies:
        description: snapshot des IDs de connexions
        items:
          type: string
        type: array
      block_id:
        type: string
      created_at:
        type: string
      hash:
        type: string
      note:
        type: string
      number:
        type: integer
    type: object
  myr-core_domain_model.WorkspaceInstance:
    properties:
      asset_id:
        description: ID du composant ou module référencé
        type: string
      id:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
info:
  contact: {}
  description: API REST de myr-core — blockchain, stockage fichiers, identités, sessions.
    Le CLI (`myr-cli`) et tout logiciel tiers (GUI, plugin CAO, script) consomment
    cette même API via le domaine (`domain/`).
  title: Myr API
  version: "1.0"
paths:
  /admin/sessions:
    get:
      description: Réservé au rôle admin. Le token n'est jamais renvoyé en entier
        (seulement les 8 premiers caractères) pour ne pas exposer un secret exploitable
        côté client.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Lister les sessions actives
      tags:
      - admin
  /admin/sessions/{token}:
    delete:
      parameters:
      - description: token complet de la session (pas le préfixe renvoyé par GET /admin/sessions)
        in: path
        name: token
        required: true
        type: string
      responses:
        "204":
          description: pas de contenu
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Révoquer une session
      tags:
      - admin
  /assembly-links:
    post:
      consumes:
      - application/json
      description: Sans asset d'accroche, les deux interfaces doivent être compatibles
        (RM10, critères RM11) ; avec une accroche, c'est elle qui doit l'être avec
        chacune. Une interface d'une instance donnée ne sert qu'à une liaison (RM09)
        et n'est jamais reliée à elle-même. Une liaison qui devient incompatible plus
        tard porte incompatible:true et n'est pas supprimée automatiquement (RM12).
      parameters:
      - description: from_iface_id et to_iface_id requis
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/adapters_in_rest.assemblyLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/adapters_in_rest.connectionDTO'
        "400":
          description: interfaces incompatibles, ou interface reliée à elle-même
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: interface déjà engagée dans une liaison (RM09)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Créer une liaison entre deux interfaces
      tags:
      - connections
  /channels:
    get:
      consumes:
      - application/json
      description: GET est public. PUT accepte X-Myr-Token ou une session déjà authentifiée
        et valide le canal contre la liste des canaux connus du réseau actif.
      parameters:
      - description: '{ \'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Lire ou changer le canal actif
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: GET est public. PUT accepte X-Myr-Token ou une session déjà authentifiée
        et valide le canal contre la liste des canaux connus du réseau actif.
      parameters:
      - description: '{ \'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Lire ou changer le canal actif
      tags:
      - admin
  /components:
    get:
      description: Filtre côté serveur — ne renvoie qu'un sous-ensemble pour éviter
        de tout charger. Inclut tout Model3D, décomposé (instances non vide) ou non.
      parameters:
      - description: recherche texte (nom, description, tags)
        in: query
        name: q
        type: string
      - description: 'catégories séparées par virgule (ex: base,variation)'
        in: query
        name: categories
        type: string
      - description: filtre par propriétaire
        in: query
        name: owner_id
        type: string
      - description: filtre par asset parent
        in: query
        name: parent_id
        type: string
      - description: filtre par hash SHA-256 exact
        in: query
        name: hash
        type: string
      - description: tags séparés par virgule (correspondance sur au moins un tag)
        in: query
        name: tags
        type: string
      - description: 'filtre par statut : draft ou submitted'
        in: query
        name: status
        type: string
      - description: nombre maximum de résultats (défaut 200, max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adapters_in_rest.graphResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lister les composants
      tags:
      - components
    post:
      consumes:
      - multipart/form-data
      description: 'Crée un asset. La catégorie (RM02) et le canal sont obligatoires
        : aucune valeur par défaut, 400 s''ils manquent. Le fichier CAO 3D est optionnel
        (champ "file", ou "stl" pour rétrocompatibilité) ; une miniature base64 peut
        être fournie, le serveur n''en dérive aucune de lui-même. Le composant est
        toujours créé en brouillon local ("status":"draft", aucune transaction blockchain)
        — voir POST /components/{id}/submit pour l''engager explicitement sur la blockchain.'
      parameters:
      - description: nom du composant (max 256 caractères)
        in: formData
        name: name
        required: true
        type: string
      - description: description (max 10000 caractères)
        in: formData
        name: description
        type: string
      - description: 'catégorie (RM02) : base, amelioration, variation, adaptation,
          derivation, extension ou regression'
        in: formData
        name: category
        required: true
        type: string
      - description: 'propriétaire — ignoré quand la session est liée à une identité
          : le propriétaire est alors cette identité (pseudo@org), qui signera la
          soumission'
        in: formData
        name: owner_id
        type: string
      - description: asset parent (dérivation)
        in: formData
        name: parent_id
        type: string
      - description: canal cible
        in: formData
        name: channel_id
        required: true
        type: string
      - description: licence
        in: formData
        name: license_id
        type: string
      - description: tags séparés par virgule
        in: formData
        name: tags
        type: string
      - description: liens externes, tableau JSON encodé en chaîne
        in: formData
        name: links
        type: string
      - description: fichier CAO 3D
        in: formData
        name: file
        type: file
      - description: miniature en data URL base64
        in: formData
        name: thumbnail
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/adapters_in_rest.componentDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Créer un composant
      tags:
      - components
  /components/{id}:
    delete:
      description: Un brouillon est réellement retiré du stockage local. Un composant
        déjà soumis est masqué localement — il disparaît de GET /components mais reste
        consultable via GET /components/{id} — la blockchain Fabric ne supporte aucune
        suppression (règle 9) et son enregistrement n'est jamais modifié.
      parameters:
      - description: identifiant du composant
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: pas de contenu
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Supprimer un composant
      tags:
      - components
    get:
      parameters:
      - description: identifiant du composant
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adapters_in_rest.componentDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Détail d'un composant
      tags:
      - components
    patch:
      consumes:
      - application/json
      description: 'Modifie un composant en brouillon. Champs modifiables : name,
        description, license_id (présente au catalogue, compatible avec la licence
        du parent — RM03), tags, links. Un composant soumis est immuable (RM19) :
        409, toute évolution passe par un composant dérivé (parent_id).'
      parameters:
      - description: identifiant du composant
        in: path
        name: id
        required: true
        type: string
      - description: champs à modifier (name, description, license_id, tags, links)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adapters_in_rest.componentDTO'
        "400":
          description: licence absente du catalogue ou incompatible avec le parent
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: composant déjà soumis
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Modifier un composant
      tags:
      - components
  /components/{id}/assemblies:
    get:
      consumes:
      - application/json
      description: GET renvoie les connexions référencées par Assemblies (liste vide
        si l'asset n'a aucune instance). POST rattache une connexion déjà créée (myr
        model link add) à cette liste — brouillon local, sans effet blockchain avant
        soumission. La connexion doit exister et relier deux instances de l'asset
        (400 sinon).
      parameters:
      - description: identifiant de l'asset
        in: path
        name: id
        required: true
        type: string
      - description: connection_id requis — POST uniquement
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adapters_in_rest.componentDTO'
        "400":
          description: connexion inexistante ou qui ne relie pas deux instances de
            l'asset
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: asset déjà soumis (RM19)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Connexions internes d'un asset décomposé
      tags:
      - components
    post:
      consumes:
      - application/json
      description: GET renvoie les connexions référencées par Assemblies (liste vide
        si l'asset n'a aucune instance). POST rattache une connexion déjà créée (myr
        model link add) à cette liste — brouillon local, sans effet blockchain avant
        soumission. La connexion doit exister et relier deux instances de l'asset
        (400 sinon).
      parameters:
      - description: identifiant de l'asset
        in: path
        name: id
        required: true
        type: string
      - description: connection_id requis — POST uniquement
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adapters_in_rest.componentDTO'
        "400":
          description: connexion inexistante ou qui ne relie pas deux instances de
            l'asset
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: asset déjà soumis (RM19)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Connexions internes d'un asset décomposé
      tags:
      - components
  /components/{id}/assemblies/{connID}:
    delete:
      description: Retire connID de la liste Assemblies de l'asset — brouillon local,
        sans effet blockchain avant soumission. Ne supprime pas la connexion elle-même
        (voir DELETE /connections/{id}).
      parameters:
      - description: identifiant de l'asset
        in: path
        name: id
        required: true
        type: string
      - description: identifiant de la connexion à détacher
        in: path
        name: connID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adapters_in_rest.componentDTO'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - MyrToken: []
      summary: Détacher une connexion d'un asset décomposé
      tags:
      - components
  /components/{id}/instances:
    get:
      consumes:
      - application/json
      description: GET renvoie la liste des instances (vide si l'asset n'a jamais
        été décomposé). POST ajoute un composant existant comme instance — brouillon
        local, sans effet blockchain avant soumission. Un asset qui est l'asset lui-même
        ou le contient, même indirectement, est refusé (400).
      parameters:
      - description: identifiant de l'asset
        in: path
        name: id
        required: true
        type: string
      - description: asset_id requis — POST uniquement
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/adapters_in_rest.componentDTO'
        "400":
          description: composition cyclique
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: asset ajouté introuvable
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: asset déjà soumis (RM19)
          schema:
            additionalProperties:
